<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioMap Lab v3.2 — Workspace de Entomologia, Epidemiologia & Pesquisa</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fontes Inter e JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            obsidian: '#020617',
            slatecard: '#0f172a',
            slateelevated: '#1e293b',
          }
        }
      }
    };
  </script>

  <style>
    /* Estilo base e scrollbar discreta em tema escuro */
    body {
      background-color: #020617;
      color: #f1f5f9;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #020617;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-fade-in {
      animation: fadeSlideUp 0.2s ease-out forwards;
    }

    /* Slider customizado para marcos acadêmicos */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: #1e293b;
      height: 6px;
      border-radius: 9999px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #10b981;
      cursor: pointer;
      border: 2px solid #020617;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.35);
      transition: transform 0.15s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    /* =====================================================================
       REGRAS DE IMPRESSÃO LIMPA PARA O GERADOR DE ETIQUETAS DE LÂMINAS
       ===================================================================== */
    #print-labels-sheet {
      display: none;
    }

    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      #app,
      #modal-overlay,
      #toast-container {
        display: none !important;
      }
      #print-labels-sheet {
        display: grid !important;
        grid-template-columns: repeat(3, 1fr);
        gap: 6mm;
        padding: 8mm;
        background: #ffffff !important;
        color: #000000 !important;
        width: 100%;
      }
      .print-slide-label {
        border: 1px solid #111827 !important;
        padding: 3mm 3.5mm !important;
        font-family: 'JetBrains Mono', monospace !important;
        font-size: 7.5pt !important;
        line-height: 1.3 !important;
        color: #000000 !important;
        background: #ffffff !important;
        page-break-inside: avoid;
        break-inside: avoid;
      }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-200">

  <!-- Container Principal da Aplicação -->
  <div id="app" class="min-h-screen flex flex-col lg:flex-row">

    <!-- Backdrop Mobile para Sidebar Esquerda -->
    <div id="sidebar-backdrop" onclick="toggleMobileSidebar(false)" class="fixed inset-0 bg-black/75 backdrop-blur-xs z-30 hidden lg:hidden"></div>

    <!-- =====================================================================
         1. BARRA LATERAL DE NAVEGAÇÃO (ESQUERDA)
         ===================================================================== -->
    <aside id="left-sidebar" class="fixed lg:sticky top-0 left-0 z-40 h-screen w-68 max-w-[17rem] bg-slate-900 border-r border-slate-800/90 flex flex-col justify-between transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-in-out shrink-0 overflow-y-auto">
      <div>
        <!-- Identidade Visual -->
        <div class="h-16 px-4 flex items-center justify-between border-b border-slate-800/90">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500/20 to-cyan-500/20 border border-emerald-500/35 flex items-center justify-center text-emerald-400 shadow-inner">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 3h6m-5 0v5.5a2.5 2.5 0 0 0 5 0V3M6 21h12M12 17v4m-4-4h8a4 4 0 0 0 3.46-6M8 14h4" />
                <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" />
              </svg>
            </div>
            <div>
              <h1 class="text-sm font-bold tracking-tight text-white flex items-center gap-1.5">
                BioMap <span class="text-emerald-400">Lab</span>
                <span class="text-[10px] font-mono px-1.5 py-0.2 rounded bg-slate-800 text-cyan-300 border border-slate-700">v3.2</span>
              </h1>
              <p class="text-[11px] text-slate-400 leading-tight">Entomo • Epidemio • SIG</p>
            </div>
          </div>
          <button onclick="toggleMobileSidebar(false)" class="lg:hidden p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800" aria-label="Fechar menu">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <!-- Menu de Navegação Principal -->
        <nav class="p-3 space-y-1" aria-label="Módulos do Workspace">
          <p class="px-3 pt-1.5 pb-1 text-[10px] font-semibold uppercase tracking-wider text-slate-500">Módulos de Pesquisa</p>

          <button onclick="switchTab('agenda')" data-nav="agenda" class="nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition-all">
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/></svg>
              <span>Visão Geral & Agenda</span>
            </span>
            <span id="badge-agenda" class="text-[11px] font-mono px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">0</span>
          </button>

          <button onclick="switchTab('bancada')" data-nav="bancada" class="nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition-all">
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 2v7.31M14 9.3V1.99M8.5 2h7M14 9.3a6.5 6.5 0 1 1-4 0"/><path d="M5.52 16h12.96"/></svg>
              <span>Bancada & Lâminas</span>
            </span>
            <span id="badge-bancada" class="text-[11px] font-mono px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">0</span>
          </button>

          <button onclick="switchTab('sig')" data-nav="sig" class="nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition-all">
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
              <span>Dados & SIG</span>
            </span>
            <span id="badge-sig" class="text-[11px] font-mono px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">0</span>
          </button>

          <button onclick="switchTab('pesquisa')" data-nav="pesquisa" class="nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition-all">
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              <span>Pesquisa & Chaves</span>
            </span>
            <span id="badge-pesquisa" class="text-[11px] font-mono px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">0</span>
          </button>

          <button onclick="switchTab('arquivos')" data-nav="arquivos" class="nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition-all">
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
              <span>Arquivos & Pranchas</span>
            </span>
            <span id="badge-arquivos" class="text-[11px] font-mono px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">0</span>
          </button>

          <button onclick="switchTab('campo')" data-nav="campo" class="nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition-all">
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
              <span>Campo & Marcos</span>
            </span>
            <span id="badge-campo" class="text-[11px] font-mono px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">0%</span>
          </button>
        </nav>
      </div>

      <!-- ===================================================================
           PAINEL DEDICADO: SINCRONIZAÇÃO & BACKUP ENTRE COMPUTADORES
           =================================================================== -->
      <div class="p-3.5 border-t border-slate-800/90 space-y-3 bg-slate-950/40">
        <!-- Indicador de Progresso Geral -->
        <div class="p-2.5 rounded-xl bg-slate-950/90 border border-slate-800/90">
          <div class="flex items-center justify-between text-xs mb-1">
            <span class="text-slate-400 font-medium">Progresso Geral</span>
            <span id="sidebar-overall-pct" class="font-mono text-emerald-400 font-semibold">0%</span>
          </div>
          <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
            <div id="sidebar-overall-bar" class="h-full bg-gradient-to-r from-emerald-500 to-cyan-400 rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
          <p id="sidebar-specimen-summary" class="mt-1.5 text-[11px] text-slate-400">0 espécimes em bancada</p>
        </div>

        <!-- Bloco de Sincronização & Backup JSON -->
        <div class="p-3 rounded-xl bg-slate-900/95 border border-slate-800 space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
              Sincronização & Backup
            </span>
          </div>

          <!-- Badge Dinâmico de Status do Backup -->
          <div id="backup-status-container" class="rounded-lg p-2 border text-[11px] leading-snug transition-all">
            <!-- Preenchido via updateBackupStatusUI() -->
          </div>

          <!-- Botões Exportar & Importar -->
          <div class="grid grid-cols-1 gap-1.5">
            <button onclick="exportBackupJSON()" class="w-full py-2 px-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-semibold text-xs flex items-center justify-center gap-1.5 shadow-sm transition-colors cursor-pointer">
              <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
              <span>Exportar Backup JSON</span>
            </button>

            <button onclick="triggerImportBackupJSON()" class="w-full py-2 px-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-cyan-300 font-medium text-xs flex items-center justify-center gap-1.5 transition-colors cursor-pointer">
              <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
              <span>Importar Backup JSON</span>
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- =====================================================================
         2. COLUNA CENTRAL (CABEÇALHO + CONTEÚDO DINÂMICO DOS MÓDULOS)
         ===================================================================== -->
    <div class="flex-1 flex flex-col min-w-0">

      <!-- Cabeçalho Superior -->
      <header class="sticky top-0 z-20 h-16 bg-slate-950/90 backdrop-blur-md border-b border-slate-800/90 px-4 sm:px-6 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <!-- Botão Menu Mobile -->
          <button onclick="toggleMobileSidebar(true)" class="lg:hidden p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white" aria-label="Abrir menu">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>

          <div class="min-w-0">
            <h2 id="header-title" class="text-base sm:text-lg font-semibold text-white truncate">Visão Geral & Agenda</h2>
            <p id="header-date" class="text-[11px] text-slate-400 hidden sm:block truncate"></p>
          </div>
        </div>

        <!-- Busca Global -->
        <div class="relative flex-1 max-w-md mx-2">
          <div class="relative flex items-center">
            <svg class="w-4 h-4 text-slate-400 absolute left-3 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input
              id="global-search-input"
              type="text"
              placeholder="Buscar lote, espécie, IBGE, artigo..."
              oninput="handleGlobalSearch(this.value)"
              onfocus="handleGlobalSearch(this.value)"
              class="w-full pl-9 pr-14 py-1.5 text-sm bg-slate-900 border border-slate-800 focus:border-emerald-500/60 focus:ring-1 focus:ring-emerald-500/40 rounded-xl text-slate-100 placeholder-slate-500 outline-none transition-all"
            />
            <button id="clear-search-btn" onclick="clearGlobalSearch()" class="hidden absolute right-2 text-[11px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 hover:text-white">Limpar</button>
          </div>

          <!-- Resultados da Busca Global -->
          <div id="global-search-results" class="hidden absolute left-0 right-0 mt-2 bg-slate-900 border border-slate-700/90 rounded-2xl shadow-2xl max-h-96 overflow-y-auto z-50 p-2 space-y-1"></div>
        </div>

        <!-- Monitor IndexedDB + Botão Scratchpad -->
        <div class="flex items-center gap-2 shrink-0">
          <!-- Monitor de Uso IndexedDB -->
          <div id="vault-storage-badge" onclick="switchTab('arquivos')" class="hidden sm:flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-[11px] font-mono text-cyan-300 cursor-pointer transition-colors" title="Espaço utilizado no cofre local IndexedDB deste navegador">
            <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
            <span id="vault-storage-text">Cofre: 0.0 MB</span>
          </div>

          <!-- Toggle Bloco de Notas Rápidas -->
          <button onclick="toggleScratchpadDrawer()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 text-xs font-medium text-cyan-300 transition-colors cursor-pointer" title="Abrir/Fechar Bloco de Notas Rápidas">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            <span class="hidden md:inline">Notas</span>
          </button>
        </div>
      </header>

      <!-- Área Central Dinâmica -->
      <main id="main-content" class="flex-1 p-4 sm:p-6 max-w-6xl w-full mx-auto space-y-6">
        <!-- Renderizado dinamicamente -->
      </main>
    </div>

    <!-- =====================================================================
         3. PAINEL LATERAL DIREITO RETRÁTIL: BLOCO DE NOTAS RÁPIDAS (SCRATCHPAD)
         ===================================================================== -->
    <div id="scratchpad-backdrop" onclick="toggleScratchpadDrawer(false)" class="fixed inset-0 bg-black/65 backdrop-blur-xs z-30 hidden xl:hidden"></div>

    <aside id="scratchpad-panel" class="fixed xl:sticky top-0 right-0 z-40 h-screen w-80 sm:w-96 xl:w-80 2xl:w-96 bg-slate-900 border-l border-slate-800/90 flex flex-col transform translate-x-full xl:translate-x-0 transition-transform duration-200 ease-in-out shrink-0">
      <div class="h-16 px-4 border-b border-slate-800/90 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-cyan-400"></span>
          <h3 class="text-sm font-semibold text-white">Bloco de Notas Rápidas</h3>
        </div>
        <div class="flex items-center gap-1">
          <button onclick="copyScratchpad()" class="p-1.5 rounded-lg text-slate-400 hover:text-emerald-400 hover:bg-slate-800 transition-colors" title="Copiar notas">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button onclick="openClearScratchpadModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-400 hover:bg-slate-800 transition-colors" title="Limpar rascunho">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
          <button onclick="toggleScratchpadDrawer(false)" class="xl:hidden p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800" aria-label="Fechar notas">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
      </div>

      <!-- Barra de Inserção Rápida Morfométrica & Campo -->
      <div class="px-3 py-2 bg-slate-950/70 border-b border-slate-800/90 flex flex-wrap items-center gap-1.5">
        <span class="text-[10px] uppercase tracking-wider text-slate-500 mr-0.5">Inserir:</span>
        <button onclick="insertScratchSnippet('timestamp')" class="px-2 py-0.5 text-[11px] font-mono rounded bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-slate-700/80">+ Hora</button>
        <button onclick="insertScratchSnippet('♀ ')" class="px-2 py-0.5 text-[11px] font-mono rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/80">♀</button>
        <button onclick="insertScratchSnippet('♂ ')" class="px-2 py-0.5 text-[11px] font-mono rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/80">♂</button>
        <button onclick="insertScratchSnippet('µm ')" class="px-2 py-0.5 text-[11px] font-mono rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/80">µm</button>
        <button onclick="insertScratchSnippet('sp. ')" class="px-2 py-0.5 text-[11px] font-mono italic rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/80">sp.</button>
        <button onclick="insertScratchSnippet('s.l. ')" class="px-2 py-0.5 text-[11px] font-mono italic rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/80">s.l.</button>
        <button onclick="insertScratchSnippet('Lat/Lon: ')" class="px-2 py-0.5 text-[11px] font-mono rounded bg-slate-800 hover:bg-slate-700 text-emerald-300 border border-slate-700/80">Lat/Lon</button>
      </div>

      <!-- Textarea com Salvamento Automático -->
      <div class="flex-1 p-3 flex flex-col">
        <textarea
          id="scratchpad-textarea"
          oninput="handleScratchpadInput(this.value)"
          placeholder="Rascunho rápido de bancada e campo...&#10;&#10;• Medidas morfométricas (palpos, cibário, asa)&#10;• Variações morfológicas atípicas&#10;• Códigos IBGE ou filtros QGIS/SQL&#10;• Ideias para discussão do manuscrito"

    // 2. ESTADO GLOBAL & PERSISTÊNCIA (LOCALSTORAGE + INDEXEDDB)
    // =========================================================================
    let state = loadState();

    function loadState() {
      try {
        let raw = localStorage.getItem(STORAGE_KEY);
        let migratedFromLegacy = false;

        if (!raw) {
          for (const legacyKey of LEGACY_STORAGE_KEYS) {
            const candidate = localStorage.getItem(legacyKey);
            if (candidate) {
              raw = candidate;
              migratedFromLegacy = true;
              break;
            }
          }
        }

        if (!raw) {
          const initial = getDefaultSeedData();
          initial.batches = initial.batches.map(normalizeBatchRecord);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
          return initial;
        }

        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') {
          return getDefaultSeedData();
        }

        const merged = { ...getDefaultSeedData(), ...parsed, version: '3.2' };
        merged.batches = Array.isArray(merged.batches)
          ? merged.batches.map(normalizeBatchRecord)
          : getDefaultSeedData().batches.map(normalizeBatchRecord);

        if (migratedFromLegacy) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
        }

        return merged;
      } catch (err) {
        console.error('Erro ao ler localStorage:', err);
        return getDefaultSeedData();
      }
    }

    function saveState(markDirty = true) {
      if (markDirty) {
        state.hasUnsavedBackupChanges = true;
      }
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.error('Erro ao salvar no localStorage:', err);
        showToast('Aviso: limite de armazenamento local atingido. Exporte um backup JSON.', 'error');
      }
      updateBackupStatusUI();
    }

    // Inicialização do IndexedDB para PDFs, Microfotografias e Arquivos de Trabalho
    function initIndexedDB() {
      return new Promise((resolve) => {
        if (!window.indexedDB) {
          console.warn('IndexedDB não suportado neste navegador.');
          resolve(null);
          return;
        }
        const request = indexedDB.open(IDB_NAME, IDB_VERSION);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE, { keyPath: 'id' });
          }
        };
        request.onsuccess = async (event) => {
          idbInstance = event.target.result;
          await refreshVaultCacheAndStats();
          resolve(idbInstance);
        };
        request.onerror = (event) => {
          console.error('Erro ao abrir IndexedDB:', event.target.error);
          resolve(null);
        };
      });
    }

    function idbPutFile(record) {
      return new Promise((resolve, reject) => {
        if (!idbInstance) {
          reject(new Error('IndexedDB indisponível'));
          return;
        }
        const tx = idbInstance.transaction([IDB_STORE], 'readwrite');
        const store = tx.objectStore(IDB_STORE);
        const req = store.put(record);
        req.onsuccess = () => resolve(record);
        req.onerror = () => reject(req.error);
      });
    }

    function idbGetFile(id) {
      return new Promise((resolve, reject) => {
        if (!idbInstance || !id) {
          resolve(null);
          return;
        }
        const tx = idbInstance.transaction([IDB_STORE], 'readonly');
        const store = tx.objectStore(IDB_STORE);
        const req = store.get(id);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    function idbDeleteFile(id) {
      return new Promise((resolve) => {
        if (!idbInstance || !id) {
          resolve();
          return;
        }
        const tx = idbInstance.transaction([IDB_STORE], 'readwrite');
        const store = tx.objectStore(IDB_STORE);
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => resolve();
      });
    }

    function idbGetAllFiles() {
      return new Promise((resolve) => {
        if (!idbInstance) {
          resolve([]);
          return;
        }
        const tx = idbInstance.transaction([IDB_STORE], 'readonly');
        const store = tx.objectStore(IDB_STORE);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
    }

    async function refreshVaultCacheAndStats() {
      const records = await idbGetAllFiles();
      existingVaultIds.clear();
      let totalBytes = 0;

      records.forEach((rec) => {
        existingVaultIds.add(rec.id);
        if (rec.blob && typeof rec.blob.size === 'number') {
          totalBytes += rec.blob.size;
          if (rec.type && rec.type.startsWith('image/') && !blobUrlCache.has(rec.id)) {
            blobUrlCache.set(rec.id, URL.createObjectURL(rec.blob));
          }
        }
      });

      vaultTotalBytes = totalBytes;
      const mb = (totalBytes / (1024 * 1024)).toFixed(1);
      const storageEl = document.getElementById('vault-storage-text');
      if (storageEl) {
        storageEl.textContent = `Cofre: ${mb} MB`;
      }
    }

    // Armazena um File/Blob no IndexedDB e registra metadados em state.vaultMeta
    async function storeFileInVault(file, extraMeta = {}) {
      const fileId = extraMeta.id || ('file-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7));
      const mimeType = file.type || guessMimeType(file.name);
      const record = {
        id: fileId,
        name: file.name,
        type: mimeType,
        size: file.size,
        blob: file,
        createdAt: new Date().toISOString()
      };

      await idbPutFile(record);
      existingVaultIds.add(fileId);
      if (mimeType.startsWith('image/')) {
        blobUrlCache.set(fileId, URL.createObjectURL(file));
      }

      const existingMetaIdx = state.vaultMeta.findIndex(m => m.id === fileId);
      const metaEntry = {
        id: fileId,
        name: file.name,
        title: extraMeta.title || file.name,
        type: mimeType,
        size: file.size,
        structure: extraMeta.structure || '',
        magnification: extraMeta.magnification || '',
        batchId: extraMeta.batchId || '',
        notes: extraMeta.notes || '',
        createdAt: record.createdAt
      };

      if (existingMetaIdx >= 0) {
        state.vaultMeta[existingMetaIdx] = { ...state.vaultMeta[existingMetaIdx], ...metaEntry };
      } else {
        state.vaultMeta.unshift(metaEntry);
      }

      saveState(true);
      await refreshVaultCacheAndStats();
      return metaEntry;
    }

    function guessMimeType(filename) {
      const lower = (filename || '').toLowerCase();
      if (lower.endsWith('.pdf')) return 'application/pdf';
      if (lower.endsWith('.png')) return 'image/png';
      if (lower.endsWith('.jpg') || lower.endsWith('.jpeg')) return 'image/jpeg';
      if (lower.endsWith('.webp')) return 'image/webp';
      if (lower.endsWith('.csv')) return 'text/csv';
      if (lower.endsWith('.xlsx') || lower.endsWith('.xls')) return 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
      if (lower.endsWith('.zip')) return 'application/zip';
      if (lower.endsWith('.geojson') || lower.endsWith('.json')) return 'application/json';
      return 'application/octet-stream';
    }

    function formatBackupTimestamp(isoString) {
      if (!isoString) return '';
      try {
        const dt = new Date(isoString);
        const now = new Date();
        const isToday = dt.toDateString() === now.toDateString();
        const hh = String(dt.getHours()).padStart(2, '0');
        const mm = String(dt.getMinutes()).padStart(2, '0');
        if (isToday) {
          return `Hoje às ${hh}:${mm}`;
        }
        const dd = String(dt.getDate()).padStart(2, '0');
        const mo = String(dt.getMonth() + 1).padStart(2, '0');
        return `${dd}/${mo} às ${hh}:${mm}`;
      } catch (e) {
        return '';
      }
    }

    function exportBackupJSON() {
      try {
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const filename = `biomap_lab_backup_${yyyy}-${mm}-${dd}.json`;

        const payload = {
          app: 'BioMap Lab',
          version: '3.2',
          exportedAt: now.toISOString(),
          data: {
            scratchpad: state.scratchpad || '',
            tasks: state.tasks || [],
            batches: state.batches || [],
            sigProjects: state.sigProjects || [],
            sigLogs: state.sigLogs || [],
            references: state.references || [],
            vaultMeta: state.vaultMeta || [],
            fieldChecklist: state.fieldChecklist || [],
            milestones: state.milestones || []
          }
        };

        const jsonStr = JSON.stringify(payload, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);

        state.lastBackupAt = now.toISOString();
        state.hasUnsavedBackupChanges = false;
        saveState(false);
        showToast(`Backup exportado: ${filename}`, 'success');
      } catch (err) {
        console.error('Erro ao exportar JSON:', err);
        showToast('Erro ao gerar o arquivo de backup JSON.', 'error');
      }
    }

    function mergeById(existingArr, incomingArr) {
      const map = new Map();
      (existingArr || []).forEach(item => {
        if (item && item.id) map.set(item.id, item);
      });
      (incomingArr || []).forEach(item => {
        if (item && item.id) {
          map.set(item.id, item);
        }
      });
      return Array.from(map.values());
    }

    function applyImportedBackup(mode) {
      if (!pendingImportedPayload) return;
      const incoming = pendingImportedPayload.data;
      const normalizedIncomingBatches = (incoming.batches || []).map(normalizeBatchRecord);

      if (mode === 'replace') {
        state.scratchpad = incoming.scratchpad;
        state.tasks = incoming.tasks;
        state.batches = normalizedIncomingBatches;
        state.sigProjects = incoming.sigProjects;
        state.sigLogs = incoming.sigLogs;
        state.references = incoming.references;
        state.vaultMeta = incoming.vaultMeta;
        state.fieldChecklist = incoming.fieldChecklist;
        state.milestones = incoming.milestones;
      } else {
        // Mesclar: atualiza existentes por ID, adiciona novos e concatena notas rápidas se diferentes
        state.tasks = mergeById(state.tasks, incoming.tasks);
        state.batches = mergeById(state.batches, normalizedIncomingBatches);
        state.sigProjects = mergeById(state.sigProjects, incoming.sigProjects);
        state.sigLogs = mergeById(state.sigLogs, incoming.sigLogs);
        state.references = mergeById(state.references, incoming.references);
        state.vaultMeta = mergeById(state.vaultMeta, incoming.vaultMeta);
        state.fieldChecklist = mergeById(state.fieldChecklist, incoming.fieldChecklist);
        state.milestones = mergeById(state.milestones, incoming.milestones);
        if (incoming.scratchpad && incoming.scratchpad.trim() && incoming.scratchpad.trim() !== (state.scratchpad || '').trim()) {
          state.scratchpad = `${state.scratchpad}\n\n--- [Importado do Backup] ---\n${incoming.scratchpad}`.trim();
        }
      }

      state.lastBackupAt = new Date().toISOString();
      state.hasUnsavedBackupChanges = false;
      saveState(false);

      const scratchEl = document.getElementById('scratchpad-textarea');
      if (scratchEl) {
        scratchEl.value = state.scratchpad || '';
        updateScratchpadCounter();
      }

      pendingImportedPayload = null;
      closeModal();
      renderApp();
      showToast(mode === 'replace' ? 'Backup restaurado com sucesso!' : 'Registros mesclados com sucesso!', 'success');
    }

    // =========================================================================
    // 4. UTILITÁRIOS GERAIS (SEGURANÇA HTML, TOASTS, CLIPBOARD, MODAIS)
    // =========================================================================
    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatBytes(bytes) {
      if (!bytes || bytes <= 0) return '0 KB';
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }

    function formatDateBR(isoDate) {
      if (!isoDate) return '';
      const parts = isoDate.split('-');
      if (parts.length !== 3) return isoDate;
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const colors = {
        success: 'bg-slate-900 border-emerald-500/60 text-emerald-300',
        error: 'bg-slate-900 border-rose-500/60 text-rose-300',
        info: 'bg-slate-900 border-cyan-500/60 text-cyan-300'
      };
      const icon = type === 'success' ? '✓' : type === 'error' ? '!' : '•';

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-2.5 rounded-xl border shadow-2xl text-xs font-medium animate-fade-in ${colors[type] || colors.info}`;
      toast.innerHTML = `<span class="font-bold text-sm">${icon}</span><span>${escapeHTML(message)}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(6px)';
        toast.style.transition = 'all 0.2s ease';
        setTimeout(() => toast.remove(), 220);
      }, 3200);
    }

    function copyToClipboard(text, successMsg = 'Copiado para a área de transferência!') {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(successMsg, 'success');
      } catch (err) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => showToast(successMsg, 'success'));
        }
      }
    }

    function insertScratchSnippet(snippet) {
      const ta = document.getElementById('scratchpad-textarea');
      if (!ta) return;
      let textToInsert = snippet;
      if (snippet === 'timestamp') {
        const now = new Date();
        textToInsert = `[${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}] `;
      }
      const start = ta.selectionStart || 0;
      const end = ta.selectionEnd || 0;
      const current = ta.value;
      ta.value = current.slice(0, start) + textToInsert + current.slice(end);
      ta.focus();
      ta.selectionStart = ta.selectionEnd = start + textToInsert.length;
      handleScratchpadInput(ta.value);
    }

    function copyScratchpad() {

    // =========================================================================
    // 6. BUSCA GLOBAL EM TEMPO REAL
    // =========================================================================
    function handleGlobalSearch(query) {
      const box = document.getElementById('global-search-results');
      const clearBtn = document.getElementById('clear-search-btn');
      if (!box) return;

      const q = (query || '').trim().toLowerCase();
      if (clearBtn) {
        clearBtn.classList.toggle('hidden', q.length === 0);
      }

      if (q.length < 2) {
        box.classList.add('hidden');
        box.innerHTML = '';
        return;
      }

      const results = [];

      state.tasks.forEach(t => {
        if (`${t.title} ${t.category} ${t.notes} ${t.pdfName}`.toLowerCase().includes(q)) {
          results.push({ tab: 'agenda', badge: 'Tarefa', title: t.title, sub: `${t.category} • ${t.pdfName ? `PDF pág. ${t.currentPage}` : t.priority}` });
        }
      });

      state.batches.forEach(b => {
        if (`${b.code} ${b.targetGroup} ${b.municipality} ${b.notes}`.toLowerCase().includes(q)) {
          const steps = getBatchSteps(b);
          const stageLabel = steps[b.stage] || 'Em processamento';
          results.push({ tab: 'bancada', badge: 'Bancada', title: `${b.code} — ${b.targetGroup}`, sub: `${b.municipality} • ${stageLabel}` });
        }
      });

      state.sigLogs.forEach(l => {
        if (`${l.tag} ${l.dataset} ${l.message}`.toLowerCase().includes(q)) {
          results.push({ tab: 'sig', badge: 'Log SIG', title: `${l.tag}: ${l.dataset || 'Base'}`, sub: l.message });
        }
      });

      state.references.forEach(r => {
        if (`${r.title} ${r.authorsYear} ${r.notes} ${r.pdfName}`.toLowerCase().includes(q)) {
          results.push({ tab: 'pesquisa', badge: r.type, title: r.title, sub: r.authorsYear });
        }
      });

      state.vaultMeta.forEach(f => {
        if (`${f.title} ${f.name} ${f.structure} ${f.notes}`.toLowerCase().includes(q)) {
          results.push({ tab: 'arquivos', badge: 'Arquivo', title: f.title || f.name, sub: `${f.structure || 'Cofre'} • ${formatBytes(f.size)}` });
        }
      });

      if (results.length === 0) {
        box.innerHTML = `<p class="p-3 text-xs text-slate-400 text-center">Nenhum resultado encontrado para "<span class="text-white">${escapeHTML(query)}</span>".</p>`;
      } else {
        box.innerHTML = results.slice(0, 12).map(r => `
          <button onclick="selectSearchResult('${r.tab}')" class="w-full text-left p-2.5 rounded-xl hover:bg-slate-800/90 transition-colors flex items-start gap-2.5">
            <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 shrink-0 mt-0.5">${escapeHTML(r.badge)}</span>
            <div class="min-w-0">
              <p class="text-xs font-semibold text-white truncate">${escapeHTML(r.title)}</p>
              <p class="text-[11px] text-slate-400 truncate">${escapeHTML(r.sub)}</p>
            </div>
          </button>
        `).join('');
      }
      box.classList.remove('hidden');
    }

    function selectSearchResult(tab) {
      clearGlobalSearch();
      switchTab(tab);
    }

    function clearGlobalSearch() {
      const input = document.getElementById('global-search-input');
      const box = document.getElementById('global-search-results');
      const clearBtn = document.getElementById('clear-search-btn');
      if (input) input.value = '';
      if (box) {
        box.classList.add('hidden');
        box.innerHTML = '';
      }
      if (clearBtn) clearBtn.classList.add('hidden');
    }

    document.addEventListener('click', (e) => {
      const searchWrapper = document.getElementById('global-search-input')?.parentElement?.parentElement;
      const box = document.getElementById('global-search-results');
      if (searchWrapper && box && !searchWrapper.contains(e.target)) {
        box.classList.add('hidden');
      }
    });

    // =========================================================================
    // 7. ORQUESTRADOR PRINCIPAL DE RENDERIZAÇÃO (renderApp)
    // =========================================================================
    const TAB_TITLES = {
      agenda: 'Visão Geral & Agenda',
      bancada: 'Bancada & Lâminas',
      sig: 'Dados & SIG (Epidemiologia)',
      pesquisa: 'Pesquisa, Chaves & Artigos',
      arquivos: 'Arquivos, Fotos & Pranchas',
      campo: 'Saída de Campo & Marcos'
    };

    function renderApp() {
      const activeTab = state.activeTab || 'agenda';

      // Atualiza título e data do cabeçalho
      const titleEl = document.getElementById('header-title');
      if (titleEl) {
        titleEl.textContent = TAB_TITLES[activeTab] || 'BioMap Lab';
      }

      const dateEl = document.getElementById('header-date');
      if (dateEl) {
        try {
          const formattedDate = new Date().toLocaleDateString('pt-BR', {
            weekday: 'long',
            day: '2-digit',
            month: 'long',
            year: 'numeric'
          });
          dateEl.textContent = formattedDate.charAt(0).toUpperCase() + formattedDate.slice(1);
        } catch (e) {
          dateEl.textContent = '';
        }
      }

      // Atualiza destaque dos botões de navegação na barra lateral
      document.querySelectorAll('.nav-btn').forEach((btn) => {
        const isCurrent = btn.getAttribute('data-nav') === activeTab;
        btn.className = `nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition-all cursor-pointer ${
          isCurrent
            ? 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/35 shadow-xs'
            : 'text-slate-400 hover:text-white hover:bg-slate-800/70 border border-transparent'
        }`;
      });

      // Atualiza contadores e indicadores laterais
      const pendingTasks = state.tasks.filter(t => t.status !== 'done').length;
      const doneTasks = state.tasks.filter(t => t.status === 'done').length;
      const totalTasks = state.tasks.length;

      const activeBatches = state.batches.filter(b => {
        const steps = getBatchSteps(b);
        return b.stage < steps.length - 1;
      }).length;

      const totalSpecimens = state.batches.reduce(
        (acc, b) => acc + (Number(b.females) || 0) + (Number(b.males) || 0),
        0
      );

      const openSigLogs = state.sigLogs.filter(l => !l.resolved).length;
      const avgMilestonePct = state.milestones.length
        ? Math.round(state.milestones.reduce((acc, m) => acc + (Number(m.progress) || 0), 0) / state.milestones.length)
        : 0;

      const overallPct = totalTasks ? Math.round((doneTasks / totalTasks) * 100) : 0;

      const setBadge = (id, val) => {
        const el = document.getElementById(id);
        if (el) el.textContent = val;
      };

      setBadge('badge-agenda', pendingTasks);
      setBadge('badge-bancada', activeBatches);
      setBadge('badge-sig', openSigLogs);
      setBadge('badge-pesquisa', state.references.length);
      setBadge('badge-arquivos', state.vaultMeta.length);
      setBadge('badge-campo', `${avgMilestonePct}%`);

      const pctEl = document.getElementById('sidebar-overall-pct');
      const barEl = document.getElementById('sidebar-overall-bar');
      const specEl = document.getElementById('sidebar-specimen-summary');
      if (pctEl) pctEl.textContent = `${overallPct}%`;
      if (barEl) barEl.style.width = `${overallPct}%`;
      if (specEl) specEl.textContent = `${totalSpecimens} espécime(s) em ${state.batches.length} lote(s)`;

      updateBackupStatusUI();

      // Renderiza o módulo ativo
      const mainEl = document.getElementById('main-content');
      if (!mainEl) return;

      switch (activeTab) {
        case 'bancada':
          mainEl.innerHTML = renderBancadaTab();
          break;
        case 'sig':
          mainEl.innerHTML = renderSigTab();
          break;
        case 'pesquisa':
          mainEl.innerHTML = renderPesquisaTab();
          break;
        case 'arquivos':
          mainEl.innerHTML = renderArquivosTab();
          break;
        case 'campo':
          mainEl.innerHTML = renderCampoTab();
          break;
        case 'agenda':
        default:
          mainEl.innerHTML = renderAgendaTab();
          break;
      }
    }

    // =========================================================================

    function renderAgendaTab() {

      const filteredTasks = state.tasks.filter(t => {
        const catOk = state.agendaCategoryFilter === 'Todas' || t.category === state.agendaCategoryFilter;
        const prioOk = state.agendaPriorityFilter === 'Todas' || t.priority === state.agendaPriorityFilter;
        return catOk && prioOk;
      });

      const pendingCount = state.tasks.filter(t => t.status !== 'done').length;
      const doneCount = state.tasks.filter(t => t.status === 'done').length;
      const totalSpecimens = state.batches.reduce((s, b) => s + (Number(b.females) || 0) + (Number(b.males) || 0), 0);

      return `

            <p class="text-[11px] text-slate-400">Tarefas & Prazos</p>
            <div class="flex items-baseline justify-between mt-1">
              <span class="text-xl font-bold font-mono text-white">${pendingCount} <span class="text-xs font-normal text-slate-400">pendentes</span></span>
              <span class="text-[11px] font-mono text-emerald-400">${doneCount} feitas</span>
            </div>
          </div>

          <div onclick="switchTab('bancada')" class="p-3.5 rounded-2xl bg-slate-900 border border-slate-800/90 hover:border-emerald-500/40 cursor-pointer transition-colors">
            <p class="text-[11px] text-slate-400">Bancada Entomológica</p>
            <div class="flex items-baseline justify-between mt-1">
              <span class="text-xl font-bold font-mono text-emerald-400">${state.batches.length} <span class="text-xs font-normal text-slate-400">lotes</span></span>
              <span class="text-[11px] font-mono text-slate-300">${totalSpecimens} ind.</span>
            </div>
          </div>

          <div onclick="switchTab('sig')" class="p-3.5 rounded-2xl bg-slate-900 border border-slate-800/90 hover:border-cyan-500/40 cursor-pointer transition-colors">

            <div class="flex items-baseline justify-between mt-1">
              <span class="text-xl font-bold font-mono text-cyan-400">${state.sigProjects.length} <span class="text-xs font-normal text-slate-400">fluxos</span></span>
              <span class="text-[11px] font-mono text-amber-300">${openLogs} logs</span>

          </div>

          <div onclick="switchTab('pesquisa')" class="p-3.5 rounded-2xl bg-slate-900 border border-slate-800/90 hover:border-violet-500/40 cursor-pointer transition-colors">

              <span class="text-[11px] font-mono text-slate-300">${state.references.length} refs</span>
            </div>

        <!-- Barra de Criação Rápida + Botão Completo com PDF -->
        <section class="p-4 rounded-2xl bg-slate-900 border border-slate-800/90 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <h3 class="text-sm font-bold text-white">Agenda de Atividades & Leituras Técnicas</h3>

            </div>

              <span>+ Nova Tarefa / Leitura PDF</span>
            </button>
          </div>

          <form onsubmit="quickAddTask(event)" class="flex flex-col sm:flex-row gap-2">
            <input id="quick-task-title" type="text" required placeholder="Adicionar tarefa rápida (ex.: Conferir lâminas do lote LOT-2026-014)..." class="flex-1 px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-800 focus:border-emerald-500/60 text-xs text-white placeholder-slate-500 outline-none" />
            <select id="quick-task-cat" class="px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 outline-none">

    function renderAgendaList(tasks) {
      if (tasks.length === 0) {
        return `
          <div class="p-10 rounded-2xl bg-slate-900/60 border border-dashed border-slate-800 text-center text-xs text-slate-400">
            Nenhuma tarefa encontrada neste filtro.
          </div>
        `;
      }

      const ordered = [
        ...tasks.filter(t => t.status === 'doing'),
        ...tasks.filter(t => t.status === 'todo'),
        ...tasks.filter(t => t.status === 'done')
      ];

      return `
        <section class="space-y-3">
          ${ordered.map(t => renderTaskCard(t, false)).join('')}
        </section>
      `;
    }

    function renderAgendaKanban(tasks) {
      const cols = [
        { id: 'todo', title: 'A Fazer', accent: 'text-slate-200 border-slate-700' },
        { id: 'doing', title: 'Em Andamento', accent: 'text-cyan-300 border-cyan-500/40' },
        { id: 'done', title: 'Concluído', accent: 'text-emerald-300 border-emerald-500/40' }
      ];

      return `
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-4">
          ${cols.map(col => {
            const colTasks = tasks.filter(t => t.status === col.id);
            return `
              <div
                ondragover="onTaskDragOver(event)"
                ondrop="onTaskDrop(event, '${col.id}')"
                class="p-3.5 rounded-2xl bg-slate-900/80 border border-slate-800 min-h-[18rem] flex flex-col gap-3"
              >
                <div class="flex items-center justify-between pb-2 border-b ${col.accent}">
                  <h4 class="text-xs font-bold uppercase tracking-wider">${col.title}</h4>
                  <span class="text-xs font-mono px-2 py-0.5 rounded-full bg-slate-950 text-slate-300 border border-slate-800">${colTasks.length}</span>
                </div>
                <div class="space-y-2.5 flex-1">
                  ${colTasks.length === 0
                    ? `<p class="text-[11px] text-slate-500 text-center py-8 border border-dashed border-slate-800/80 rounded-xl">Arraste uma tarefa para cá</p>`
                    : colTasks.map(t => renderTaskCard(t, true)).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </section>
      `;
    }

    function renderTaskCard(task, compact = false) {
      const isDone = task.status === 'done';
      const catStyle = CATEGORY_STYLES[task.category] || 'bg-slate-800 text-slate-300 border-slate-700';
      const prioStyle = PRIORITY_STYLES[task.priority] || 'bg-slate-800 text-slate-300 border-slate-700';
      const hasPdfMeta = Boolean(task.pdfName || task.pdfId);
      const hasLocalPdfBlob = Boolean(task.pdfId && existingVaultIds.has(task.pdfId));
      const curPage = Math.max(1, parseInt(task.currentPage, 10) || 1);
      const totPages = Math.max(curPage, parseInt(task.totalPages, 10) || 1);
      const readPct = Math.min(100, Math.round((curPage / totPages) * 100));

      return `
        <article
          draggable="true"
          ondragstart="onTaskDragStart(event, '${task.id}')"
          class="p-4 rounded-2xl bg-slate-900 border ${isDone ? 'border-slate-800/60 opacity-70' : 'border-slate-800 hover:border-slate-700'} space-y-2.5 transition-all"

                <div class="flex flex-wrap items-center gap-1.5 mb-1">

                  <span class="text-[10px] font-medium px-2 py-0.5 rounded border ${prioStyle}">${escapeHTML(task.priority)}</span>
                  ${task.dueDate ? `<span class="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-950 text-slate-400 border border-slate-800">📅 ${escapeHTML(formatDateBR(task.dueDate))}</span>` : ''}
                </div>
                <h4 class="text-xs sm:text-sm font-semibold ${isDone ? 'line-through text-slate-500' : 'text-white'} leading-snug">${escapeHTML(task.title)}</h4>
              </div>
            </label>

            <div class="flex items-center gap-1 shrink-0">
              <button onclick="openTaskModal('${task.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-cyan-300 hover:bg-slate-800" title="Editar tarefa">✎</button>
              <button onclick="deleteTask('${task.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-400 hover:bg-slate-800" title="Excluir tarefa">✕</button>
            </div>
          </div>

          ${task.notes ? `<p class="text-xs text-slate-400 leading-relaxed pl-6">${escapeHTML(task.notes)}</p>` : ''}

          <!-- Anexo PDF & Marcador de Página -->
          ${hasPdfMeta ? `
            <div class="ml-0 sm:ml-6 p-3 rounded-xl bg-slate-950/90 border border-cyan-500/25 space-y-2">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <span class="text-xs font-mono text-cyan-200 truncate">📄 ${escapeHTML(task.pdfName)}</span>
                <div class="flex items-center gap-1.5">
                  <button onclick="stepItemPage('task', '${task.id}', -1)" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[11px] font-mono text-slate-200">-1</button>
                  <span class="text-xs font-mono text-emerald-300 px-1.5">Pág. ${curPage} / ${totPages} (${readPct}%)</span>
                  <button onclick="stepItemPage('task', '${task.id}', 1)" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[11px] font-mono text-slate-200">+1</button>
                  ${hasLocalPdfBlob ? `
                    <button onclick="openPdfReaderModal('task', '${task.id}')" class="ml-1 px-2.5 py-1 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-500/40 text-xs font-semibold text-cyan-200 cursor-pointer">
                      Abrir PDF
                    </button>
                  ` : ''}
                </div>
              </div>

              <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                <div class="h-full bg-gradient-to-r from-cyan-400 to-emerald-400 rounded-full" style="width: ${readPct}%"></div>
              </div>

              ${!hasLocalPdfBlob ? `

                  <span>PDF vinculado: <strong class="font-mono">${escapeHTML(task.pdfName)}</strong> (pág. <strong>${curPage}</strong> sincronizada).</span>

      }
    }

    function onTaskDragOver(event) {
      event.preventDefault();

        event.dataTransfer.dropEffect = 'move';
      }
    }

      const id = draggedTaskId || event.dataTransfer?.getData('text/plain');

        setTaskStatus(id, targetStatus);
        draggedTaskId = null;
      }

    async function saveTaskFromModal(event, editId) {
      event.preventDefault();
      const title = document.getElementById('task-title').value.trim();
      if (!title) return;

      const category = document.getElementById('task-cat').value;
      const priority = document.getElementById('task-prio').value;
      const status = document.getElementById('task-status').value;
      const dueDate = document.getElementById('task-due').value;
      const notes = document.getElementById('task-notes').value.trim();
      const currentPage = Math.max(1, parseInt(document.getElementById('task-cur-page').value, 10) || 1);
      const totalPages = Math.max(currentPage, parseInt(document.getElementById('task-tot-page').value, 10) || 1);

      const fileInput = document.getElementById('task-pdf-file');
      const existingSelect = document.getElementById('task-pdf-existing');
      const uploadedFile = fileInput && fileInput.files && fileInput.files[0];

      const existingTask = editId ? state.tasks.find(t => t.id === editId) : null;
      let pdfId = existingTask ? existingTask.pdfId : '';
      let pdfName = existingTask ? existingTask.pdfName : '';

      if (uploadedFile) {
        const meta = await storeFileInVault(uploadedFile, { title });
        pdfId = meta.id;
        pdfName = uploadedFile.name;
      } else if (existingSelect && existingSelect.value) {
        const sel = state.vaultMeta.find(m => m.id === existingSelect.value);
        if (sel) {
          pdfId = sel.id;
          pdfName = sel.name;
        }
      }

      if (existingTask) {
        Object.assign(existingTask, { title, category, priority, status, dueDate, notes, pdfId, pdfName, currentPage, totalPages });
      } else {
        state.tasks.unshift({
          id: 't-' + Date.now(),
          title,
          category,
          priority,
          status,
          dueDate,
          notes,
          pdfId,
          pdfName,
          currentPage,
          totalPages
        });
      }

      saveState(true);
      closeModal();
      renderApp();
      showToast('Tarefa salva com sucesso!', 'success');
    }

    // =========================================================================
    // 8. LEITOR DIVIDIDO DE PDF, MARCADOR DE PÁGINAS & REANEXAÇÃO LOCAL
    // =========================================================================
    function getPdfHostItem(kind, id) {
      if (kind === 'task') return state.tasks.find(t => t.id === id) || null;
      if (kind === 'ref') return state.references.find(r => r.id === id) || null;
      return null;
    }

    function stepItemPage(kind, id, delta) {
      const item = getPdfHostItem(kind, id);
      if (!item) return;
      const tot = Math.max(1, parseInt(item.totalPages, 10) || 1);
      const cur = Math.max(1, parseInt(item.currentPage, 10) || 1);
      item.currentPage = Math.min(tot, Math.max(1, cur + delta));
      saveState(true);
      renderApp();
    }

    async function openPdfReaderModal(kind, id) {
      const item = getPdfHostItem(kind, id);
      if (!item || !item.pdfId) return;

      const record = await idbGetFile(item.pdfId);
      if (!record || !record.blob) {
        showToast('PDF não encontrado neste computador. Selecione o arquivo local para reanexar.', 'info');
        triggerReattachLocalPdf(kind, id);
        return;
      }

      if (activeReaderObjectUrl) {
        URL.revokeObjectURL(activeReaderObjectUrl);
      }
      activeReaderObjectUrl = URL.createObjectURL(record.blob);

      const curPage = Math.max(1, parseInt(item.currentPage, 10) || 1);
      const totPages = Math.max(curPage, parseInt(item.totalPages, 10) || 1);
      const pct = Math.min(100, Math.round((curPage / totPages) * 100));

      const html = `
        <div class="p-4 sm:p-5 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-3">
            <div class="min-w-0">
              <span class="text-[10px] font-mono uppercase tracking-wider text-cyan-400">Leitor Dividido de PDF</span>
              <h3 class="text-sm sm:text-base font-bold text-white truncate">${escapeHTML(item.title)}</h3>
            </div>
            <div class="flex items-center gap-2">
              <a href="${activeReaderObjectUrl}" target="_blank" rel="noopener" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-cyan-300">Abrir em Nova Aba ↗</a>
              <button onclick="closeModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800">✕</button>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
            <!-- Visualizador PDF -->
            <div class="lg:col-span-8">
              <iframe
                id="pdf-reader-iframe"
                src="${activeReaderObjectUrl}#page=${curPage}"
                class="w-full h-[60vh] lg:h-[75vh] rounded-xl border border-slate-800 bg-slate-950"
                title="Visualizador de PDF"
              ></iframe>
            </div>

            <!-- Painel Lateral de Controle de Página e Fichamento -->
            <div class="lg:col-span-4 flex flex-col justify-between bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-4">
              <div class="space-y-3">
                <div>
                  <span class="block text-xs font-semibold text-emerald-400 mb-2">Marcador de Leitura</span>
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block text-[10px] text-slate-400 mb-1">Página Atual</label>
                      <input id="reader-cur-page" type="number" min="1" value="${curPage}" onchange="syncReaderPageFromInputs('${kind}', '${id}')" class="w-full px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-xs font-mono text-white outline-none" />
                    </div>
                    <div>
                      <label class="block text-[10px] text-slate-400 mb-1">Total de Páginas</label>
                      <input id="reader-tot-pages" type="number" min="1" value="${totPages}" onchange="syncReaderPageFromInputs('${kind}', '${id}')" class="w-full px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-xs font-mono text-white outline-none" />
                    </div>
                  </div>
                </div>

                <div class="flex items-center gap-2">
                  <button type="button" onclick="stepReaderPage('${kind}', '${id}', -1)" class="flex-1 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-mono text-slate-200">-1 Pág.</button>
                  <button type="button" onclick="syncReaderPageFromInputs('${kind}', '${id}', true)" class="flex-1 py-1.5 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-500/40 text-xs font-semibold text-cyan-200">Ir para Pág.</button>

                <div class="space-y-1">

                  </div>
                  <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">

              </button>

    function stepReaderPage(kind, id, delta) {
      const curInput = document.getElementById('reader-cur-page');
      const totInput = document.getElementById('reader-tot-pages');
      if (!curInput || !totInput) return;
      const tot = Math.max(1, parseInt(totInput.value, 10) || 1);
      const next = Math.min(tot, Math.max(1, (parseInt(curInput.value, 10) || 1) + delta));
      curInput.value = next;
      syncReaderPageFromInputs(kind, id, true);
    }

    function syncReaderPageFromInputs(kind, id, reloadIframe = false) {
      const item = getPdfHostItem(kind, id);
      const curInput = document.getElementById('reader-cur-page');
      const totInput = document.getElementById('reader-tot-pages');
      if (!item || !curInput || !totInput) return;

      const tot = Math.max(1, parseInt(totInput.value, 10) || 1);
      const cur = Math.min(tot, Math.max(1, parseInt(curInput.value, 10) || 1));
      curInput.value = cur;
      totInput.value = tot;

      item.currentPage = cur;
      item.totalPages = tot;
      saveState(true);

      const pct = Math.min(100, Math.round((cur / tot) * 100));
      const pctLabel = document.getElementById('reader-pct-label');
      const pctBar = document.getElementById('reader-pct-bar');
      if (pctLabel) pctLabel.textContent = `${pct}%`;
      if (pctBar) pctBar.style.width = `${pct}%`;

      if (reloadIframe && activeReaderObjectUrl) {
        const iframe = document.getElementById('pdf-reader-iframe');
        if (iframe) {
          iframe.src = `${activeReaderObjectUrl}#page=${cur}`;
        }
      }
    }

    function updateReaderNotes(kind, id, val) {
      const item = getPdfHostItem(kind, id);
      if (!item) return;
      item.notes = val;
      saveState(true);
    }

    function triggerReattachLocalPdf(kind, id) {
      pendingReattachContext = { kind, id };
      const input = document.getElementById('reattach-pdf-input');
      if (input) {
        input.value = '';
        input.click();
      }
    }

    async function handleReattachPdfSelected(event) {
      const file = event.target.files && event.target.files[0];
      if (!file || !pendingReattachContext) return;

      const { kind, id } = pendingReattachContext;
      const item = getPdfHostItem(kind, id);
      if (item) {
        const reuseId = item.pdfId || ('file-' + Date.now());
        await storeFileInVault(file, {
          id: reuseId,
          title: item.title || file.name
        });
        item.pdfId = reuseId;
        item.pdfName = file.name;
        saveState(true);
        renderApp();
        showToast(`PDF reanexado na página ${item.currentPage || 1}!`, 'success');
      }
      pendingReattachContext = null;
    }

    // =========================================================================
    // 9. LIGHTBOX DE ZOOM PARA MICROFOTOGRAFIAS & DOWNLOAD DE ARQUIVOS
    // =========================================================================
    async function openImageLightbox(fileId) {
      const meta = state.vaultMeta.find(m => m.id === fileId);
      let imgUrl = blobUrlCache.get(fileId);

      if (!imgUrl) {
        const rec = await idbGetFile(fileId);
        if (rec && rec.blob) {
          imgUrl = URL.createObjectURL(rec.blob);
          blobUrlCache.set(fileId, imgUrl);
        }
      }

      if (!imgUrl) {
        showToast('Imagem não encontrada localmente neste navegador.', 'error');
        return;
      }

      lightboxZoom = 1;
      const batch = meta?.batchId ? state.batches.find(b => b.id === meta.batchId) : null;

      openModal(`
        <div class="p-4 sm:p-5 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-3">
            <div class="min-w-0">
              <h3 class="text-sm sm:text-base font-bold text-white truncate">${escapeHTML(meta?.title || meta?.name || 'Visualização de Imagem')}</h3>
              <p class="text-[11px] text-slate-400">
                ${meta?.structure ? `Estrutura: <span class="text-emerald-300">${escapeHTML(meta.structure)}</span> • ` : ''}
                ${meta?.magnification ? `Aumento: <span class="font-mono text-cyan-300">${escapeHTML(meta.magnification)}</span> • ` : ''}
                ${batch ? `Lote: <span class="font-mono text-amber-300">${escapeHTML(batch.code)}</span>` : ''}
              </p>
            </div>

            <div class="flex items-center gap-1.5">
              <button onclick="adjustLightboxZoom(-0.25)" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-mono text-white">Zoom -</button>
              <button onclick="resetLightboxZoom()" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-mono text-cyan-300">100%</button>
              <button onclick="adjustLightboxZoom(0.25)" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-mono text-white">Zoom +</button>
              <button onclick="downloadVaultFile('${fileId}')" class="px-3 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-semibold text-xs">Baixar</button>
              <button onclick="closeModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800">✕</button>
            </div>
          </div>

          <div class="w-full h-[65vh] bg-slate-950 border border-slate-800 rounded-xl overflow-auto flex items-center justify-center p-4">
            <img id="lightbox-img" src="${imgUrl}" alt="${escapeHTML(meta?.title || 'Imagem')}" class="max-w-full max-h-full object-contain transition-transform duration-150 origin-center" style="transform: scale(1);" />
          </div>

          ${meta?.notes ? `<p class="text-xs text-slate-300 bg-slate-950 p-3 rounded-xl border border-slate-800">${escapeHTML(meta.notes)}</p>` : ''}
        </div>
      `, 'max-w-5xl');
    }

    function adjustLightboxZoom(delta) {
      lightboxZoom = Math.min(4, Math.max(0.5, lightboxZoom + delta));
      const img = document.getElementById('lightbox-img');
      if (img) img.style.transform = `scale(${lightboxZoom})`;
    }

    function resetLightboxZoom() {
      lightboxZoom = 1;
      const img = document.getElementById('lightbox-img');
      if (img) img.style.transform = 'scale(1)';
    }

    async function downloadVaultFile(fileId) {
      const rec = await idbGetFile(fileId);
      if (!rec || !rec.blob) {
        showToast('Arquivo local indisponível para download neste dispositivo.', 'error');
        return;
      }
      const url = URL.createObjectURL(rec.blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = rec.name || 'arquivo_biomap';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // =========================================================================

                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>

              </button>
              <button onclick="openBatchModal()" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-semibold text-xs flex items-center gap-1.5 transition-colors cursor-pointer">

                    <span>${escapeHTML(pf.label)}</span>
                    <span class="font-mono text-[10px] px-1.5 py-0.2 rounded-full bg-slate-800/90 text-slate-300">${count}</span>

            <div class="inline-flex rounded-xl bg-slate-950 p-1 border border-slate-800 self-start lg:self-auto">
              ${statusFilters.map(sf => `

    function renderBatchCard(batch) {

      const isFinished = currentIdx >= steps.length - 1;
      const linkedPhotos = state.vaultMeta.filter(m => m.batchId === batch.id && (m.type || '').startsWith('image/'));
      const totalSpec = (Number(batch.females) || 0) + (Number(batch.males) || 0);

      return `
        <article class="p-4 sm:p-5 rounded-2xl bg-slate-900 border border-slate-800 hover:border-slate-700 flex flex-col justify-between gap-4 transition-all">

              <div>
                <div class="flex flex-wrap items-center gap-1.5">

                  <span class="text-[11px] font-medium px-2 py-0.5 rounded-lg border ${proto.badgeClass}">${escapeHTML(proto.label)}</span>
                  <span class="text-[11px] font-mono px-2 py-0.5 rounded-md bg-slate-800 text-slate-300">${escapeHTML(batch.mountingMedium)}</span>

              <div class="flex items-center gap-1 shrink-0">
                <button onclick="openBatchModal('${batch.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-cyan-300 hover:bg-slate-800" title="Editar lote">✎</button>
                <button onclick="deleteBatch('${batch.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-400 hover:bg-slate-800" title="Excluir lote">✕</button>
              </div>
            </div>

            <!-- Metadados de Coleta & Contagem -->
            <div class="p-3 rounded-xl bg-slate-950/90 border border-slate-800/90 space-y-1.5 text-xs">
              <p class="text-slate-300"><span class="text-slate-500">Localidade:</span> ${escapeHTML(batch.municipality)}</p>

              <div class="flex items-center gap-3 pt-1 font-mono text-xs">
                <span class="text-pink-300">♀ ${Number(batch.females) || 0}</span>
                <span class="text-sky-300">♂ ${Number(batch.males) || 0}</span>
                <span class="text-slate-400">Total: <strong class="text-white">${totalSpec}</strong></span>
              </div>
            </div>

            <!-- Barra Visual Interativa com Todas as Etapas do Protocolo -->
            <div class="space-y-2">
              <div class="flex items-center justify-between text-xs">
                <span class="font-semibold text-cyan-300">Etapa ${currentIdx + 1}/${steps.length}: ${escapeHTML(steps[currentIdx])}</span>
                <span class="font-mono text-slate-400">${stagePct}%</span>
              </div>

              <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                <div class="h-full bg-gradient-to-r from-emerald-500 to-cyan-400 rounded-full transition-all" style="width: ${stagePct}%"></div>
              </div>

              <!-- Passos Clicáveis para Pular Diretamente para Qualquer Etapa -->
              <div class="flex flex-wrap gap-1 pt-0.5">
                ${steps.map((stepLabel, idx) => {
                  const isCurrent = idx === currentIdx;
                  const isPast = idx < currentIdx;
                  let pillClass = 'bg-slate-950 border-slate-800 text-slate-500 hover:text-slate-200 hover:border-slate-600';
                  if (isCurrent) {
                    pillClass = 'bg-cyan-500/20 border-cyan-400/60 text-cyan-200 font-semibold shadow-xs';
                  } else if (isPast) {
                    pillClass = 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300/90 hover:border-emerald-400';
                  }
                  return `
                    <button
                      type="button"
                      onclick="setBatchStage('${batch.id}', ${idx})"
                      title="Clique para ir direto para: ${escapeHTML(stepLabel)}"
                      class="px-2 py-1 rounded-lg border text-[10px] transition-all cursor-pointer ${pillClass}"
                    >
                      ${isPast ? '✓ ' : `${idx + 1}. `}${escapeHTML(stepLabel)}

                Etiqueta
              </button>
              <button onclick="openBatchModal('${batch.id}')" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 border border-slate-700 transition-colors cursor-pointer">
                Editar

            </div>

            ${!isFinished ? `
              <button onclick="advanceBatchStage('${batch.id}')" class="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-semibold text-xs transition-colors cursor-pointer">
                Avançar Etapa →
              </button>
            ` : `
              <span class="px-3 py-1.5 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-xs font-semibold text-emerald-300">
                ✓ Concluído
              </span>
            `}
          </div>
        </article>
      `;
    }

    function setBancadaProtocolFilter(val) {
      state.bancadaProtocolFilter = val;
      saveState(false);
      renderApp();
    }

    function setBancadaStatusFilter(val) {
      state.bancadaStatusFilter = val;
      saveState(false);
      renderApp();
    }

    function setBatchStage(id, targetStageIdx) {
      const batch = state.batches.find(b => b.id === id);
      if (!batch) return;
      const steps = getBatchSteps(batch);
      const safeIdx = Math.min(steps.length - 1, Math.max(0, parseInt(targetStageIdx, 10) || 0));
      batch.stage = safeIdx;
      saveState(true);
      renderApp();
      showToast(`${batch.code} → ${steps[safeIdx]}`, 'success');
    }

    function advanceBatchStage(id) {
      const batch = state.batches.find(b => b.id === id);
      if (!batch) return;
      const steps = getBatchSteps(batch);
      if (batch.stage < steps.length - 1) {
        batch.stage += 1;
        saveState(true);
        renderApp();
        showToast(`Lote ${batch.code} avançou para: ${steps[batch.stage]}`, 'success');
      }
    }

    function deleteBatch(id) {
      state.batches = state.batches.filter(b => b.id !== id);
      saveState(true);
      renderApp();
      showToast('Lote removido.', 'info');
    }

    function triggerBatchPhotoUpload(batchId) {
      pendingBatchPhotoTargetId = batchId;
      const input = document.getElementById('batch-photo-input');
      if (input) {
        input.value = '';
        input.click();
      }
    }

    async function handleBatchPhotoSelected(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length || !pendingBatchPhotoTargetId) return;

      const batch = state.batches.find(b => b.id === pendingBatchPhotoTargetId);
      for (const file of files) {
        await storeFileInVault(file, {
          title: batch ? `${batch.code} — ${file.name}` : file.name,
          batchId: pendingBatchPhotoTargetId,
          structure: 'Lâmina / Espécime'
        });
      }

      pendingBatchPhotoTargetId = null;
      renderApp();
      showToast(`${files.length} foto(s) vinculada(s) ao lote!`, 'success');
    }

              <button type="button" onclick="applyBatchPreset('anopheles')" class="px-2.5 py-1.5 rounded-lg bg-cyan-500/15 hover:bg-cyan-500/25 border border-cyan-500/35 text-[11px] font-semibold text-cyan-300 transition-colors cursor-pointer">
                Anopheles
              </button>
              <button type="button" onclick="applyBatchPreset('aedes_culex')" class="px-2.5 py-1.5 rounded-lg bg-sky-500/15 hover:bg-sky-500/25 border border-sky-500/35 text-[11px] font-semibold text-sky-300 transition-colors cursor-pointer">

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

            </div>

              <label class="block text-xs font-medium text-slate-300 mb-1">Meio de Preservação / Montagem</label>
