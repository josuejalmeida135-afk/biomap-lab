    function applyBatchPreset(presetKey) {
      const preset = BANCADA_PRESETS[presetKey];
      if (!preset) return;
      const protoEl = document.getElementById('batch-protocol');
      const medEl = document.getElementById('batch-medium');
      const taxonEl = document.getElementById('batch-taxon');
      if (protoEl) protoEl.value = preset.protocol;
      if (medEl) medEl.value = preset.medium;
      if (taxonEl) taxonEl.placeholder = preset.taxonPlaceholder;
      onBatchProtocolChange();
    }

    function onBatchProtocolChange() {
      const protoEl = document.getElementById('batch-protocol');
      const customWrap = document.getElementById('batch-custom-stages-wrap');
      const customInput = document.getElementById('batch-custom-stages');
      const stageSelect = document.getElementById('batch-stage');
      if (!protoEl || !stageSelect) return;

      const protocol = protoEl.value;
      if (customWrap) {
        customWrap.classList.toggle('hidden', protocol !== 'custom');
      }

      const customArr = (customInput?.value || '')
        .split(',')
        .map(s => s.trim())
        .filter(Boolean);

      const steps = getBatchSteps({ protocol, customStages: customArr });
      const prevIdx = Math.min(steps.length - 1, Math.max(0, parseInt(stageSelect.value, 10) || 0));

      stageSelect.innerHTML = steps
        .map((st, idx) => `<option value="${idx}" ${idx === prevIdx ? 'selected' : ''}>${idx + 1}. ${escapeHTML(st)}</option>`)
        .join('');
    }

    function saveBatchFromModal(event, editId) {
      event.preventDefault();
      const protocol = document.getElementById('batch-protocol').value;
      const customRaw = document.getElementById('batch-custom-stages')?.value || '';
      const customStages = protocol === 'custom'
        ? customRaw.split(',').map(s => s.trim()).filter(Boolean)
        : [];

      if (protocol === 'custom' && customStages.length === 0) {
        showToast('Informe ao menos uma etapa personalizada separada por vírgula.', 'error');
        return;
      }

      const data = normalizeBatchRecord({
        code: document.getElementById('batch-code').value.trim(),
        protocol,
        customStages,
        targetGroup: document.getElementById('batch-taxon').value.trim(),
        municipality: document.getElementById('batch-muni').value.trim(),
        coordinates: document.getElementById('batch-coords').value.trim(),
        mountingMedium: document.getElementById('batch-medium').value,
        females: Math.max(0, parseInt(document.getElementById('batch-females').value, 10) || 0),
        males: Math.max(0, parseInt(document.getElementById('batch-males').value, 10) || 0),
        stage: parseInt(document.getElementById('batch-stage').value, 10) || 0,
        notes: document.getElementById('batch-notes').value.trim()
      });

      if (editId) {
        const existing = state.batches.find(b => b.id === editId);
        if (existing) Object.assign(existing, data);
      } else {
        state.batches.unshift({ id: 'b-' + Date.now(), ...data });
      }

      saveState(true);
      closeModal();
      renderApp();
      showToast('Lote salvo com sucesso!', 'success');
    }

    function buildGeneratedLabelsArray() {
      const header = document.getElementById('lbl-header')?.value || '';
      const baseCode = document.getElementById('lbl-code')?.value || '';
      const copies = Math.min(30, Math.max(1, parseInt(document.getElementById('lbl-copies')?.value, 10) || 1));
      const taxon = document.getElementById('lbl-taxon')?.value || '';
      const sex = document.getElementById('lbl-sex')?.value || '';
      const medium = document.getElementById('lbl-medium')?.value || '';
      const loc = document.getElementById('lbl-loc')?.value || '';
      const coords = document.getElementById('lbl-coords')?.value || '';
      const date = document.getElementById('lbl-date')?.value || '';
      const seqMode = document.getElementById('lbl-seq-mode')?.value || 'L';

      const list = [];
      for (let i = 1; i <= copies; i++) {
        const suffix = seqMode === 'NONE' ? '' : `-${seqMode}${String(i).padStart(2, '0')}`;
        list.push({
          header,
          code: `${baseCode}${suffix}`,
          taxon,
          sex,
          medium,
          loc,
          coords,
          date
        });
      }
      return list;
    }

      state.sigLogs.unshift({

        tag,

      saveState(true);

              <button onclick="openReferenceModal('${ref.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-cyan-300 hover:bg-slate-800" title="Editar referência">✎</button>
              <button onclick="deleteReference('${ref.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-400 hover:bg-slate-800" title="Excluir">✕</button>

          ${ref.notes ? `
            <div class="p-3 rounded-xl bg-slate-950/90 border border-slate-800 text-xs text-slate-300 leading-relaxed">
              <span class="font-semibold text-emerald-400">Caracteres Diagnósticos / Fichamento:</span> ${escapeHTML(ref.notes)}

          ${hasPdfMeta ? `
            <div class="p-3 rounded-xl bg-slate-950/90 border border-cyan-500/25 space-y-2.5">

                  ${hasLocalPdfBlob ? `
                    <button onclick="openPdfReaderModal('ref', '${ref.id}')" class="ml-1 px-2.5 py-1 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-500/40 text-xs font-semibold text-cyan-200">

              </div>

              <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                <div class="h-full bg-gradient-to-r from-violet-400 to-emerald-400 rounded-full" style="width: ${readPct}%"></div>
              </div>

              ${!hasLocalPdfBlob ? `
                <div class="p-2.5 rounded-lg bg-amber-500/10 border border-amber-500/30 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-[11px] text-amber-200">
                  <span>PDF vinculado: <strong class="font-mono">${escapeHTML(ref.pdfName)}</strong> — reanexe o arquivo local neste PC se quiser abrir o leitor; sua página atual (<strong>pág. ${curPage}</strong>) e anotações já estão sincronizadas!</span>
                  <button onclick="triggerReattachLocalPdf('ref', '${ref.id}')" class="px-2.5 py-1 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-200 font-semibold shrink-0">
                    Reanexar PDF local

    function setPesquisaTypeFilter(val) {
      state.pesquisaTypeFilter = val;
      saveState(false);
      renderApp();
    }
    function setPesquisaStatusFilter(val) {
      state.pesquisaStatusFilter = val;
      saveState(false);
      renderApp();
    }
    function changeReferenceStatus(id, status) {
      const ref = state.references.find(r => r.id === id);
      if (ref) {
        ref.status = status;
        saveState(true);
        renderApp();
      }
    }
    function deleteReference(id) {
      state.references = state.references.filter(r => r.id !== id);
      saveState(true);
      renderApp();
    }

    function openReferenceModal(editId = null) {
      const ref = editId ? state.references.find(r => r.id === editId) : null;
      const pdfVaultItems = state.vaultMeta.filter(m => m.type === 'application/pdf' || (m.name || '').toLowerCase().endsWith('.pdf'));

      openModal(`
        <form onsubmit="saveReferenceFromModal(event, '${editId || ''}')" class="p-5 sm:p-6 space-y-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">

            <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-white">✕</button>
          </div>

          <div>
            <label class="block text-xs text-slate-300 mb-1">Título da Obra / Artigo / Edital *</label>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">

              <select id="ref-type" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white outline-none">
                ${['Chave Taxonômica', 'Artigo', 'Nota Técnica / Manual', 'Edital / Pós-Graduação'].map(t => `<option value="${t}" ${ref?.type === t ? 'selected' : ''}>${t}</option>`).join('')}

            </div>
            <div>
              <label class="block text-xs text-slate-300 mb-1">Status</label>
              <select id="ref-status" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white outline-none">
                ${['Para baixar', 'Lendo', 'Fichado'].map(s => `<option value="${s}" ${(ref?.status || 'Lendo') === s ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="p-3.5 rounded-xl bg-cyan-500/10 border border-cyan-500/30 space-y-3">
            <span class="block text-xs font-semibold text-cyan-300">📄 Arquivo PDF & Marcador de Página</span>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <input id="ref-pdf-file" type="file" accept="application/pdf,.pdf" class="w-full text-xs text-slate-300 file:mr-2 file:py-1.5 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-cyan-500/20 file:text-cyan-200" />
              <select id="ref-pdf-existing" class="w-full px-2.5 py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-200 outline-none">
                <option value="">-- Ou PDF já salvo no Cofre --</option>
                ${pdfVaultItems.map(p => `<option value="${p.id}" ${ref?.pdfId === p.id ? 'selected' : ''}>${escapeHTML(p.title || p.name)}</option>`).join('')}
              </select>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-[11px] text-slate-300 mb-1">Página Atual</label>
                <input id="ref-cur-page" type="number" min="1" value="${ref?.currentPage || 1}" class="w-full px-3 py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs font-mono text-white outline-none" />
              </div>
              <div>
                <label class="block text-[11px] text-slate-300 mb-1">Total de Páginas</label>
                <input id="ref-tot-pages" type="number" min="1" value="${ref?.totalPages || 1}" class="w-full px-3 py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs font-mono text-white outline-none" />
              </div>
            </div>
          </div>

          <div>
            <label class="block text-xs text-slate-300 mb-1">Caracteres Diagnósticos / Fichamento</label>
            <textarea id="ref-notes" rows="3" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white outline-none">${escapeHTML(ref?.notes || '')}</textarea>
          </div>

          <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-xs text-slate-300">Cancelar</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold text-slate-950">Salvar Referência</button>
          </div>
        </form>
      `, 'max-w-xl');

    async function saveReferenceFromModal(event, editId) {
      event.preventDefault();
      const title = document.getElementById('ref-title').value.trim();
      if (!title) return;

      const authorsYear = document.getElementById('ref-authors').value.trim();
      const type = document.getElementById('ref-type').value;
      const status = document.getElementById('ref-status').value;
      const notes = document.getElementById('ref-notes').value.trim();
      const currentPage = Math.max(1, parseInt(document.getElementById('ref-cur-page').value, 10) || 1);
      const totalPages = Math.max(currentPage, parseInt(document.getElementById('ref-tot-pages').value, 10) || 1);

      const fileInput = document.getElementById('ref-pdf-file');
      const existingSelect = document.getElementById('ref-pdf-existing');
      const uploadedFile = fileInput && fileInput.files && fileInput.files[0];

      const existingRef = editId ? state.references.find(r => r.id === editId) : null;
      let pdfId = existingRef ? existingRef.pdfId : '';
      let pdfName = existingRef ? existingRef.pdfName : '';

      if (uploadedFile) {
        const meta = await storeFileInVault(uploadedFile, { title });
        pdfId = meta.id;
        pdfName = uploadedFile.name;
      } else if (existingSelect && existingSelect.value) {
        const sel = state.vaultMeta.find(m => m.id === existingSelect.value);
        if (sel) {
          pdfId = sel.id;
          pdfName = sel.name;
        }
      }

      if (existingRef) {
        Object.assign(existingRef, { title, authorsYear, type, status, notes, pdfId, pdfName, currentPage, totalPages });
      } else {
        state.references.unshift({
          id: 'r-' + Date.now(),
          title,
          authorsYear,
          type,
          status,
          url: '',
          notes,
          pdfId,
          pdfName,
          currentPage,
          totalPages
        });
      }

      saveState(true);
      closeModal();
      renderApp();
      showToast('Referência salva com sucesso!', 'success');
    }

    // =========================================================================
    // MÓDULO 5: ARQUIVOS & PRANCHAS (COFRE INDEXEDDB + DRAG & DROP + CTRL+V)
    // =========================================================================
    function renderArquivosTab() {
      const cats = ['Todos', 'Microfotografias / Imagens', 'Artigos / PDFs', 'Planilhas & SIG'];
      const filtered = state.vaultMeta.filter(f => {
        const isImg = (f.type || '').startsWith('image/');
        const isPdf = f.type === 'application/pdf' || (f.name || '').toLowerCase().endsWith('.pdf');
        if (state.arquivosCategoryFilter === 'Microfotografias / Imagens') return isImg;
        if (state.arquivosCategoryFilter === 'Artigos / PDFs') return isPdf;
        if (state.arquivosCategoryFilter === 'Planilhas & SIG') return !isImg && !isPdf;
        return true;
      });

      return `
        <!-- Área de Upload (Clique, Drag & Drop e Ctrl+V) -->
        <section
          ondragover="event.preventDefault(); this.classList.add('border-emerald-400', 'bg-emerald-500/10')"
          ondragleave="this.classList.remove('border-emerald-400', 'bg-emerald-500/10')"
          ondrop="handleVaultDrop(event)"
          class="p-6 rounded-2xl bg-slate-900 border-2 border-dashed border-slate-700 hover:border-cyan-400/60 text-center space-y-2.5 transition-all"
        >
          <div class="w-11 h-11 rounded-2xl bg-cyan-500/15 border border-cyan-500/30 text-cyan-300 flex items-center justify-center mx-auto">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
          </div>
          <div>
            <h3 class="text-sm font-bold text-white">Cofre de Microfotografias, Pranchas, PDFs & Bases SIG</h3>
            <p class="text-xs text-slate-400 mt-1">Arraste arquivos para cá, clique para selecionar ou pressione <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 font-mono text-cyan-300">Ctrl + V</kbd> para colar capturas direto do microscópio ou QGIS.</p>
          </div>
          <div class="pt-1">
            <label class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-semibold text-xs cursor-pointer transition-colors">
              <span>+ Selecionar Arquivos do Computador</span>
              <input type="file" multiple onchange="handleVaultFileInput(event)" class="hidden" />
            </label>
          </div>
        </section>

        <!-- Filtros do Cofre -->
        <section class="flex flex-wrap items-center justify-between gap-2">
          <div class="flex flex-wrap gap-1.5">
            ${cats.map(c => `
              <button onclick="setArquivosFilter('${c}')" class="px-3 py-1.5 rounded-xl text-xs font-medium ${state.arquivosCategoryFilter === c ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/40' : 'bg-slate-900 text-slate-400 border border-slate-800'}">
                ${escapeHTML(c)}
              </button>
            `).join('')}
          </div>
          <span class="text-xs font-mono text-slate-400">${filtered.length} arquivo(s) catalogado(s)</span>
        </section>

        <!-- Grade de Arquivos -->
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          ${filtered.length === 0 ? `
            <div class="sm:col-span-2 lg:col-span-3 p-10 rounded-2xl bg-slate-900/60 border border-dashed border-slate-800 text-center text-xs text-slate-400">
              Nenhum arquivo nesta categoria ainda. Envie fotos de lâminas, PDFs ou planilhas acima.
            </div>
          ` : filtered.map(f => renderVaultFileCard(f)).join('')}
        </section>
      `;
    }

    function renderVaultFileCard(fileMeta) {
      const isImg = (fileMeta.type || '').startsWith('image/');
      const isPdf = fileMeta.type === 'application/pdf' || (fileMeta.name || '').toLowerCase().endsWith('.pdf');
      const hasLocalBlob = existingVaultIds.has(fileMeta.id);
      const thumbUrl = isImg ? blobUrlCache.get(fileMeta.id) : null;
      const batch = fileMeta.batchId ? state.batches.find(b => b.id === fileMeta.batchId) : null;

      return `
        <article class="rounded-2xl bg-slate-900 border border-slate-800 overflow-hidden flex flex-col justify-between">
          <div>
            <!-- Área Visual / Miniatura -->
            <div class="h-40 bg-slate-950 border-b border-slate-800 flex items-center justify-center relative overflow-hidden">
              ${isImg && thumbUrl ? `
                <img onclick="openImageLightbox('${fileMeta.id}')" src="${thumbUrl}" alt="${escapeHTML(fileMeta.title || fileMeta.name)}" class="w-full h-full object-cover cursor-zoom-in hover:scale-105 transition-transform" />
              ` : `
                <div class="text-center p-4 space-y-1">
                  <span class="text-3xl block">${isPdf ? '📄' : isImg ? '🖼' : '📊'}</span>
                  <span class="text-[11px] font-mono text-slate-400 block truncate max-w-[14rem]">${escapeHTML(fileMeta.name)}</span>
                  ${!hasLocalBlob ? `<span class="inline-block text-[10px] px-2 py-0.5 rounded bg-amber-500/15 text-amber-300 border border-amber-500/30">Catalogado em outro PC</span>` : ''}
                </div>
              `}

              ${fileMeta.magnification ? `
                <span class="absolute top-2.5 right-2.5 text-[10px] font-mono font-bold px-2 py-0.5 rounded-md bg-slate-950/90 text-cyan-300 border border-cyan-500/40">
                  ${escapeHTML(fileMeta.magnification)}
                </span>
              ` : ''}
            </div>

            <!-- Metadados Científicos -->
            <div class="p-4 space-y-2">
              <h4 class="text-xs sm:text-sm font-bold text-white truncate" title="${escapeHTML(fileMeta.title || fileMeta.name)}">${escapeHTML(fileMeta.title || fileMeta.name)}</h4>

              <div class="flex flex-wrap gap-1.5">
                ${fileMeta.structure ? `<span class="text-[10px] px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">${escapeHTML(fileMeta.structure)}</span>` : ''}
                ${batch ? `<span class="text-[10px] font-mono px-2 py-0.5 rounded bg-amber-500/15 text-amber-300 border border-amber-500/30">${escapeHTML(batch.code)}</span>` : ''}
                <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-400">${formatBytes(fileMeta.size)}</span>
              </div>

              ${fileMeta.notes ? `<p class="text-[11px] text-slate-400 line-clamp-2">${escapeHTML(fileMeta.notes)}</p>` : ''}
            </div>
          </div>

          <!-- Ações -->
          <div class="px-4 py-2.5 bg-slate-950/60 border-t border-slate-800 flex items-center justify-between gap-1.5">
            <div class="flex items-center gap-1.5">
              ${isImg && hasLocalBlob ? `<button onclick="openImageLightbox('${fileMeta.id}')" class="px-2.5 py-1 rounded-lg bg-cyan-500/15 text-cyan-300 text-[11px] font-semibold">Zoom</button>` : ''}
              <button onclick="openVaultMetaModal('${fileMeta.id}')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-[11px] font-medium">Ficha</button>
            </div>
            <div class="flex items-center gap-1.5">
              ${hasLocalBlob ? `<button onclick="downloadVaultFile('${fileMeta.id}')" class="px-2 py-1 rounded-lg text-[11px] text-emerald-300 hover:bg-slate-800">Baixar</button>` : ''}
              <button onclick="deleteVaultFile('${fileMeta.id}')" class="px-2 py-1 rounded-lg text-[11px] text-slate-500 hover:text-rose-400">Excluir</button>
            </div>

      `;

    function setArquivosFilter(cat) {
      state.arquivosCategoryFilter = cat;
      saveState(false);
      renderApp();
    }

    async function handleVaultFileInput(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;
      for (const f of files) {
        await storeFileInVault(f);
      }
      renderApp();
      showToast(`${files.length} arquivo(s) salvo(s) no cofre!`, 'success');
    }

    async function handleVaultDrop(event) {
      event.preventDefault();
      event.currentTarget.classList.remove('border-emerald-400', 'bg-emerald-500/10');
      const files = Array.from(event.dataTransfer?.files || []);
      if (!files.length) return;
      for (const f of files) {
        await storeFileInVault(f);
      }
      renderApp();
      showToast(`${files.length} arquivo(s) adicionado(s)!`, 'success');
    }

    // Colar print / captura do microscópio ou QGIS direto com Ctrl + V
    window.addEventListener('paste', async (event) => {
      const activeTag = document.activeElement?.tagName;
      if (activeTag === 'INPUT' || activeTag === 'TEXTAREA') return;

      const items = Array.from(event.clipboardData?.items || []);
      const fileItems = items.filter(it => it.kind === 'file');
      if (!fileItems.length) return;

      const now = new Date();
      const stamp = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}_${String(now.getHours()).padStart(2, '0')}-${String(now.getMinutes()).padStart(2, '0')}`;

      let count = 0;
      for (const item of fileItems) {
        const blob = item.getAsFile();
        if (blob) {
          const ext = (blob.type || '').split('/')[1] || 'png';
          const namedFile = new File([blob], `Captura_Lab_${stamp}.${ext}`, { type: blob.type || 'image/png' });
          await storeFileInVault(namedFile, {
            title: `Captura colada (${stamp})`,
            structure: 'Captura / Prancha'
          });
          count++;
        }
      }

      if (count > 0) {
        if (state.activeTab !== 'arquivos') {
          state.activeTab = 'arquivos';
        }
        renderApp();
        showToast('Captura colada (Ctrl+V) e salva no Cofre de Arquivos!', 'success');
      }
    });

    function openVaultMetaModal(fileId) {
      const meta = state.vaultMeta.find(m => m.id === fileId);
      if (!meta) return;

      openModal(`
        <form onsubmit="saveVaultMetaFromModal(event, '${fileId}')" class="p-6 space-y-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h3 class="text-base font-bold text-white">Ficha Técnica do Arquivo / Lâmina</h3>
            <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-white">✕</button>
          </div>

          <div>
            <label class="block text-xs text-slate-300 mb-1">Título Descritivo</label>
            <input id="vm-title" type="text" required value="${escapeHTML(meta.title || meta.name)}" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white outline-none" />
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-300 mb-1">Estrutura / Tema</label>
              <input id="vm-structure" type="text" value="${escapeHTML(meta.structure || '')}" placeholder="Ex.: Espermateca, Cibário, Asa, Mapa Kernel" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white outline-none" />
            </div>
            <div>
              <label class="block text-xs text-slate-300 mb-1">Objetiva / Aumento</label>
              <select id="vm-mag" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white outline-none">
                ${['', 'Estéreo', '4x', '10x', '20x', '40x', '100x (Imersão)'].map(m => `<option value="${m}" ${meta.magnification === m ? 'selected' : ''}>${m || 'Não aplicável'}</option>`).join('')}
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs text-slate-300 mb-1">Vincular a Lote Biológico</label>
            <select id="vm-batch" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white outline-none">
              <option value="">-- Sem vínculo com lote --</option>
              ${state.batches.map(b => `<option value="${b.id}" ${meta.batchId === b.id ? 'selected' : ''}>${escapeHTML(b.code)} — ${escapeHTML(b.targetGroup)}</option>`).join('')}
            </select>
          </div>

          <div>
            <label class="block text-xs text-slate-300 mb-1">Observações da Prancha / Arquivo</label>
            <textarea id="vm-notes" rows="3" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white outline-none">${escapeHTML(meta.notes || '')}</textarea>
          </div>

          <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-xs text-slate-300">Cancelar</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-600 text-slate-950 font-semibold text-xs">Salvar Ficha</button>
          </div>
        </form>
      `, 'max-w-lg');
    }

    function saveVaultMetaFromModal(event, fileId) {
      event.preventDefault();
      const meta = state.vaultMeta.find(m => m.id === fileId);
      if (!meta) return;
      meta.title = document.getElementById('vm-title').value.trim();
      meta.structure = document.getElementById('vm-structure').value.trim();
      meta.magnification = document.getElementById('vm-mag').value;
      meta.batchId = document.getElementById('vm-batch').value;
      meta.notes = document.getElementById('vm-notes').value.trim();
      saveState(true);
      closeModal();
      renderApp();
      showToast('Ficha técnica atualizada!', 'success');
    }

    async function deleteVaultFile(fileId) {
      await idbDeleteFile(fileId);
      existingVaultIds.delete(fileId);
      if (blobUrlCache.has(fileId)) {
        URL.revokeObjectURL(blobUrlCache.get(fileId));
        blobUrlCache.delete(fileId);
      }
      state.vaultMeta = state.vaultMeta.filter(m => m.id !== fileId);
      saveState(true);
      await refreshVaultCacheAndStats();
      renderApp();
      showToast('Arquivo removido do cofre.', 'info');
    }

    // =========================================================================
    // MÓDULO 6: CAMPO & MARCOS ACADÊMICOS
    // =========================================================================
    function renderCampoTab() {
      const checkedCount = state.fieldChecklist.filter(i => i.checked).length;
      const totalCount = state.fieldChecklist.length;
      const pct = totalCount ? Math.round((checkedCount / totalCount) * 100) : 0;

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
          <!-- Coluna Esquerda: Checklist Reutilizável de Saída de Campo -->
          <section class="lg:col-span-6 p-4 sm:p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-4">
            <div class="flex items-start justify-between gap-2">
              <div>
                <h3 class="text-sm font-bold text-white">Checklist Reutilizável de Saída de Campo</h3>
                <p class="text-xs text-slate-400">Conferência de equipamentos antes da coleta entomológica.</p>
              </div>
              <button onclick="resetFieldChecklist()" class="px-3 py-1.5 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/40 text-xs font-semibold text-amber-200 shrink-0 cursor-pointer">
                Resetar Saída
              </button>
            </div>

            <div class="space-y-1">
              <div class="flex justify-between text-xs">
                <span class="text-slate-400">${checkedCount} de ${totalCount} itens prontos</span>
                <span class="font-mono text-emerald-400 font-semibold">${pct}%</span>
              </div>
              <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                <div class="h-full bg-gradient-to-r from-emerald-500 to-cyan-400 transition-all" style="width: ${pct}%"></div>
              </div>
            </div>

            <div class="space-y-2">
              ${state.fieldChecklist.map(item => `
                <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-slate-950/90 border border-slate-800/90">
                  <label class="flex items-center gap-2.5 text-xs cursor-pointer flex-1">
                    <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleFieldItem('${item.id}')" class="rounded bg-slate-900 border-slate-700 text-emerald-500" />
                    <span class="${item.checked ? 'line-through text-slate-500' : 'text-slate-200'}">${escapeHTML(item.text)}</span>
                  </label>
                  <div class="flex items-center gap-2">
                    <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-400">${escapeHTML(item.category)}</span>
                    <button onclick="deleteFieldItem('${item.id}')" class="text-slate-600 hover:text-rose-400 text-xs">✕</button>
                  </div>
                </div>
              `).join('')}
            </div>

            <form onsubmit="addFieldItem(event)" class="flex gap-2 pt-1">
              <input id="new-field-item-text" type="text" required placeholder="Adicionar equipamento ou insumo de coleta..." class="flex-1 px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white outline-none" />
              <button type="submit" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-emerald-300">+ Item</button>
            </form>
          </section>

          <!-- Coluna Direita: Trilha de Marcos Acadêmicos -->
          <section class="lg:col-span-6 space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <h3 class="text-sm font-bold text-white">Trilha de Marcos Acadêmicos & Pós-Graduação</h3>
                <p class="text-xs text-slate-400">Acompanhe metas de médio e longo prazo.</p>
              </div>
              <button onclick="openNewMilestoneModal()" class="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-semibold text-xs cursor-pointer">
                + Novo Marco
              </button>
            </div>

            <div class="space-y-3">
              ${state.milestones.map(m => `
                <article class="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-3">
                  <div class="flex items-start justify-between gap-2">
                    <div>
                      <div class="flex items-center gap-2 mb-1">
                        <span class="text-[10px] font-medium px-2 py-0.5 rounded bg-teal-500/15 text-teal-300 border border-teal-500/30">${escapeHTML(m.track)}</span>
                        <span class="text-[11px] font-mono text-slate-400">Meta: ${escapeHTML(m.deadline)}</span>
                      </div>
                      <h4 class="text-sm font-bold text-white">${escapeHTML(m.title)}</h4>
                    </div>
                    <button onclick="deleteMilestone('${m.id}')" class="text-slate-500 hover:text-rose-400 text-xs">✕</button>
                  </div>

                  <div class="space-y-1.5">
                    <div class="flex justify-between text-xs">
                      <span class="text-slate-400">Avanço</span>
                      <span id="ms-pct-${m.id}" class="font-mono font-bold text-emerald-400">${m.progress}%</span>
                    </div>
                    <input
                      type="range"
                      min="0"
                      max="100"
                      value="${m.progress}"
                      oninput="updateMilestoneProgress('${m.id}', this.value)"
                      class="w-full"
                    />
                  </div>

                  ${m.nextStep ? `<p class="text-xs text-slate-400"><span class="text-cyan-300 font-medium">Próximo passo:</span> ${escapeHTML(m.nextStep)}</p>` : ''}
                </article>
              `).join('')}
            </div>
          </section>
        </div>
      `;
    }

    function toggleFieldItem(id) {
      const item = state.fieldChecklist.find(f => f.id === id);
      if (item) {
        item.checked = !item.checked;
        saveState(true);
        renderApp();
      }
    }

    function resetFieldChecklist() {
      state.fieldChecklist.forEach(i => { i.checked = false; });
      saveState(true);
      renderApp();
      showToast('Checklist de campo resetado para a próxima expedição!', 'info');
    }

    function addFieldItem(event) {
      event.preventDefault();
      const input = document.getElementById('new-field-item-text');
      const text = (input?.value || '').trim();
      if (!text) return;
      state.fieldChecklist.push({
        id: 'fc-' + Date.now(),
        text,
        category: 'Campo',
        checked: false
      });
      saveState(true);
      renderApp();
    }

    function deleteFieldItem(id) {
      state.fieldChecklist = state.fieldChecklist.filter(f => f.id !== id);
      saveState(true);
      renderApp();
    }

    function updateMilestoneProgress(id, val) {
      const m = state.milestones.find(x => x.id === id);
      if (!m) return;
      m.progress = Math.min(100, Math.max(0, parseInt(val, 10) || 0));
      const label = document.getElementById(`ms-pct-${id}`);
      if (label) label.textContent = `${m.progress}%`;
      saveState(true);
    }

    function deleteMilestone(id) {
      state.milestones = state.milestones.filter(m => m.id !== id);
      saveState(true);
      renderApp();
    }

    function openNewMilestoneModal() {
      openModal(`
        <form onsubmit="saveNewMilestone(event)" class="p-6 space-y-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h3 class="text-base font-bold text-white">Novo Marco Acadêmico / Pesquisa</h3>
            <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-white">✕</button>
          </div>
          <div>
            <label class="block text-xs text-slate-300 mb-1">Título do Marco *</label>
            <input id="ms-title" type="text" required placeholder="Ex.: Submissão de artigo sobre distribuição de flebotomíneos" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white outline-none" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-300 mb-1">Trilha</label>
              <input id="ms-track" type="text" value="Pós-Graduação" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white outline-none" />
            </div>
            <div>
              <label class="block text-xs text-slate-300 mb-1">Prazo Estimado</label>
              <input id="ms-deadline" type="text" value="Mar 2027" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white outline-none" />
            </div>
          </div>
          <div>
            <label class="block text-xs text-slate-300 mb-1">Próximo Passo Prático</label>
            <input id="ms-next" type="text" placeholder="Ex.: Revisar tabelas morfométricas" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white outline-none" />
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-xs text-slate-300">Cancelar</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-600 text-slate-950 font-semibold text-xs">Salvar Marco</button>
          </div>
        </form>
      `, 'max-w-md');
    }

    function saveNewMilestone(event) {
      event.preventDefault();
      const title = document.getElementById('ms-title').value.trim();
      if (!title) return;
      state.milestones.unshift({
        id: 'm-' + Date.now(),
        title,
        track: document.getElementById('ms-track').value.trim() || 'Pesquisa',
        deadline: document.getElementById('ms-deadline').value.trim() || 'Em aberto',
        progress: 10,
        nextStep: document.getElementById('ms-next').value.trim()
      });
      saveState(true);
      closeModal();
      renderApp();
    }

    // =========================================================================
    // 10. INICIALIZAÇÃO DO WORKSPACE
    // =========================================================================
    async function bootstrapApp() {
      try {
        initScratchpad();
        renderApp();
        await initIndexedDB();
        renderApp();
      } catch (err) {
        console.error('Erro ao inicializar BioMap Lab:', err);
      }
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', bootstrapApp);
    } else {
      bootstrapApp();
    }
  </script>
</body>
</html>
